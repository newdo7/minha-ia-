
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha IA</title>
  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .box {
      text-align: center;
      padding: 25px;
    }
    h1 {
      font-size: 36px;
    }
    p {
      color: #aaa;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      max-width: 320px;
      padding: 14px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #1b1b1b;
      color: white;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Minha IA</h1>
    <p>Em breve vou conversar com você.</p>
    <input placeholder="Digite qualquer coisa...">
  </div>
</body>
</html>
