<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #161b22;
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid #30363d;
    }
    header h1 { font-size: 1.2rem; color: #58a6ff; letter-spacing: 1px; }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .user {
      align-self: flex-end;
      background-color: #1f6feb;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .bot {
      align-self: flex-start;
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-bottom-left-radius: 2px;
    }
    .error {
      align-self: center;
      background-color: #3d1d1d;
      color: #f85149;
      border: 1px solid #8b2a2a;
    }
    #input-container {
      display: flex;
      padding: 12px;
      background-color: #161b22;
      border-top: 1px solid #30363d;
      gap: 8px;
    }
    input {
      flex: 1;
      background-color: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    input:focus { border-color: #58a6ff; }
    button {
      background-color: #238636;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
    }
    button:disabled { background-color: #30363d; opacity: 0.6; }
  </style>
</head>
<body>

  <header>
    <h1>NEXUS AI</h1>
  </header>

  <div id="chat-container">
    <div class="message bot">Sistemas online. Eu sou a NEXUS AI. Como posso te ajudar hoje?</div>
  </div>

  <div id="input-container">
    <input type="text" id="user-input" placeholder="Digite sua mensagem..." autocomplete="off">
    <button id="send-btn" onclick="sendMessage()">Enviar</button>
  </div>

  <script>
    const WORKER_URL = "https://nexus-ai-worker.marinhowanderson189.workers.dev";

    async function sendMessage() {
      const input = document.getElementById("user-input");
      const button = document.getElementById("send-btn");
      const container = document.getElementById("chat-container");
      const text = input.value.trim();

      if (!text) return;

      // Adiciona mensagem do usuário
      appendMessage(text, "user");
      input.value = "";
      input.disabled = true;
      button.disabled = true;

      // Indicador de carregamento
      const loadingDiv = appendMessage("Pensando...", "bot");

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await res.json();
        loadingDiv.remove();

        if (res.ok && data.reply) {
          appendMessage(data.reply, "bot");
        } else {
          appendMessage("Erro: " + (data.error || "Não foi possível obter resposta."), "error");
        }
      } catch (err) {
        loadingDiv.remove();
        appendMessage("Erro de conexão com o servidor da NEXUS AI.", "error");
      }

      input.disabled = false;
      button.disabled = false;
      input.focus();
    }

    function appendMessage(text, type) {
      const container = document.getElementById("chat-container");
      const div = document.createElement("div");
      div.className = `message ${type}`;
      div.innerText = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return div;
    }

    document.getElementById("user-input").addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendMessage();
    });
  </script>

</body>
</html>
